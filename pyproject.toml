[project]
name = "sciqis-qaoa-routing"
version = "0.1.0"
description = "A scientific computing study of QAOA mixers for constrained routing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "networkx",
    "qutip",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciqis_qaoa_routing"]
