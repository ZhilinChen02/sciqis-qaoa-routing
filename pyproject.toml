[project]
name = "sciqis-qaoa-routing"
version = "1.0.0"
description = "Minimal QAOA routing reproduction notebook"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbconvert>=7,<8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "graph",
    "metrics",
    "qaoa",
    "qubo",
]
