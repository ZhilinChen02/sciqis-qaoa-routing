[project]
name = "sciqis-qaoa-routing"
version = "1.0.0"
description = "QAOA routing mechanisms for the DTU SCIQIS course project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=2,<3",
    "qiskit>=2.2,<3",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "course_final",
    "dynamics_study",
    "dynamics_figures",
    "exact_reference",
    "feasible_qaoa",
    "graph",
    "global_grover",
    "ising",
    "metrics",
    "objectives",
    "optimization",
    "penalty_demo",
    "q2f_final_improvement",
    "qaoa",
    "qaoa_dynamics",
    "qaoa_dynamics_visualization",
    "qaoa_visualization",
    "qubo",
    "sealed_results",
    "warm_start",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
